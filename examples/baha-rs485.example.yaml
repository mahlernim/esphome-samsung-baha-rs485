esphome:
  name: baha-rs485
  friendly_name: BAHA RS485

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/mahlernim/esphome-samsung-baha-rs485
      ref: main
    components: [baha_rs485]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  ap:
    ssid: !secret fallback_ap_ssid
    password: !secret fallback_ap_password

captive_portal:

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

uart:
  id: rs485_bus
  tx_pin: GPIO21
  rx_pin: GPIO20
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 256

baha_rs485:
  id: baha_bus
  uart_id: rs485_bus
  stale_timeout: 30s
  startup_listen_window: 10s
  poll_retry_interval: 5s
  idle_before_tx: 80ms
  inter_frame_gap: 120ms
  post_write_readback: 400ms

sensor:
  - platform: baha_rs485
    type: current_temperature
    baha_rs485_id: baha_bus
    room: zone1
    name: "Zone 1 Temperature"
  - platform: baha_rs485
    type: target_temperature
    baha_rs485_id: baha_bus
    room: zone1
    name: "Zone 1 Setpoint"
  - platform: baha_rs485
    type: current_temperature
    baha_rs485_id: baha_bus
    room: zone2
    name: "Zone 2 Temperature"
  - platform: baha_rs485
    type: target_temperature
    baha_rs485_id: baha_bus
    room: zone2
    name: "Zone 2 Setpoint"
  - platform: baha_rs485
    type: current_temperature
    baha_rs485_id: baha_bus
    room: zone3
    name: "Zone 3 Temperature"
  - platform: baha_rs485
    type: target_temperature
    baha_rs485_id: baha_bus
    room: zone3
    name: "Zone 3 Setpoint"
  - platform: baha_rs485
    type: current_temperature
    baha_rs485_id: baha_bus
    room: zone4
    name: "Zone 4 Temperature"
  - platform: baha_rs485
    type: target_temperature
    baha_rs485_id: baha_bus
    room: zone4
    name: "Zone 4 Setpoint"
  - platform: baha_rs485
    type: current_temperature
    baha_rs485_id: baha_bus
    room: zone5
    name: "Zone 5 Temperature"
  - platform: baha_rs485
    type: target_temperature
    baha_rs485_id: baha_bus
    room: zone5
    name: "Zone 5 Setpoint"
  - platform: wifi_signal
    name: "BAHA RS485 WiFi"
    update_interval: 900s

switch:
  # 난방 switch는 목표 온도를 밀어 올리거나 내려서 동작시킴.
  # on_delta: 현재 온도 + 1 C
  # off_delta: 현재 온도 - 2 C
  - platform: baha_rs485
    type: heater
    baha_rs485_id: baha_bus
    room: zone1
    name: "Zone 1 Heater"
    on_delta: 1
    off_delta: -2
  - platform: baha_rs485
    type: heater
    baha_rs485_id: baha_bus
    room: zone2
    name: "Zone 2 Heater"
    on_delta: 1
    off_delta: -2
  - platform: baha_rs485
    type: heater
    baha_rs485_id: baha_bus
    room: zone3
    name: "Zone 3 Heater"
    on_delta: 1
    off_delta: -2
  - platform: baha_rs485
    type: heater
    baha_rs485_id: baha_bus
    room: zone4
    name: "Zone 4 Heater"
    on_delta: 1
    off_delta: -2
  - platform: baha_rs485
    type: heater
    baha_rs485_id: baha_bus
    room: zone5
    name: "Zone 5 Heater"
    on_delta: 1
    off_delta: -2
  - platform: baha_rs485
    type: light
    baha_rs485_id: baha_bus
    channel: 1
    name: "Light Channel 1"
  - platform: baha_rs485
    type: light
    baha_rs485_id: baha_bus
    channel: 2
    name: "Light Channel 2"
  - platform: baha_rs485
    type: light
    baha_rs485_id: baha_bus
    channel: 3
    name: "Light Channel 3"
  - platform: baha_rs485
    type: light
    baha_rs485_id: baha_bus
    channel: 4
    name: "Light Channel 4"
  - platform: baha_rs485
    type: master_cutoff
    baha_rs485_id: baha_bus
    name: "Master Light Cutoff"
  - platform: restart
    name: "BAHA RS485 Restart"
